[tox]
envlist = quality, docs, py-django{42,52}
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
setenv =
    PYTHONPATH = {toxinidir}
dependency_groups =
    django42: django42
    django52: test
allowlist_externals = make
commands =
    make test

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals = make
commands =
    make lint

[testenv:docs]
runner = uv-venv-lock-runner
setenv =
    # Set here rather than in docs/Makefile since that file is generated by sphinx.
    SPHINXOPTS = -W
dependency_groups = doc
allowlist_externals = make
commands =
    make docs
    sphinx-build -W -b doctest -d {envtmpdir}/doctrees docs docs/_build/html
    sphinx-build -W -b linkcheck docs docs/_build/html

[flake8]
ignore = E128
max-line-length = 96
exclude = .tox,.git,docs,docs/conf.py,src/enmerkar_underscore/vendor/*,*.egg*
